<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>noir.py</title>
<style>
html,body{height:100%;margin:0}
body{background:#f5f4ef;color:#4a4a48;font:13px/1.6 ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;letter-spacing:-.005em;display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased}
#box{max-width:440px;padding:0 24px;text-align:center}
#dots{display:inline-flex;gap:4px;margin-right:10px;vertical-align:1px}
#dots i{width:5px;height:5px;border-radius:50%;background:#161616;animation:p 1.4s ease-in-out infinite}
#dots i:nth-child(2){animation-delay:.2s}
#dots i:nth-child(3){animation-delay:.4s}
@keyframes p{0%,100%{opacity:.2;transform:translateY(0)}50%{opacity:1;transform:translateY(-2px)}}
@media (prefers-reduced-motion:reduce){#dots i{animation:none}}
.err #dots{display:none}
button{color:#4a4a48;background:#fff;border:1px solid #c8c2ad;border-radius:9px;padding:7px 18px;font:500 12.5px inherit;letter-spacing:0;cursor:pointer;margin-top:14px}
button:hover{color:#161616;background:#faf9f5}
</style>
</head>
<body>
<div id="box"><span id="dots"><i></i><i></i><i></i></span><span id="msg">loading noir.py…</span></div>
<script>var REPO = "Toluwer/noir-py";
var FILE = "python-editor.html";

var SOURCES = [
  "https://raw.githubusercontent.com/" + REPO + "/main/" + FILE,
  "https://cdn.jsdelivr.net/gh/" + REPO + "@main/" + FILE,
  "https://cdn.statically.io/gh/" + REPO + "/main/" + FILE,
  FILE
];

function dead(){
  document.body.className = "err";
  document.getElementById("msg").innerHTML =
    "couldn't load noir.py from " + REPO + ".<br>check the connection, then " +
    '<button onclick="location.reload()">retry</button>';
}

function grab(url){
  var c = new AbortController();
  var t = setTimeout(function(){ c.abort(); }, 20000);
  function live(){ clearTimeout(t); }
  return fetch(url, { cache: "no-cache", signal: c.signal })
    .then(function(r){ return r.ok ? r.text() : Promise.reject(r.status); })
    .then(function(html){
      live();

      if (html.length < 5000 || !/^<!doctype html/i.test(html) || html.indexOf('id="app"') < 0) throw 0;
      document.open();
      document.write(html);
      document.close();
    })
    .catch(live);
}

(async function(){
  for (var i = 0; i < SOURCES.length; i++){
    await grab(SOURCES[i]);
    if (document.getElementById("app")) return;
  }
  dead();
})();
</script>
</body>
</html>
